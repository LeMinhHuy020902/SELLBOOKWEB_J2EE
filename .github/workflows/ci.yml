# SWB01-69 — CI: build & test backend (GitHub Actions)
name: CI

on:
  push:
    branches: [main, develop, them-thu-vien-tao_figma]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test with Maven
        working-directory: SellBookWeb-backend
        run: mvn -B verify
